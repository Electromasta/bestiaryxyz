# Build the Angular site and publish it to GitHub Pages on every push to master.
# The custom domain is set in the repo's Settings → Pages (a CNAME file isn't used with Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Angular 9 needs an old Node (newer ones fail on its OpenSSL use)
      - uses: actions/setup-node@v7
        with:
          node-version: 14
          cache: npm
      - run: npm ci
      # Served at the root of its custom domain (Settings → Pages). For the electromasta.github.io/<repo>/
      # address instead, use BASE_HREF: /${{ github.event.repository.name }}/
      - run: npx ng build --prod --base-href "$BASE_HREF"
        env:
          BASE_HREF: /
      # Routes are handled in the browser: serve the app for unknown paths too, so deep links work
      - run: cp dist/bestiaryxyz/index.html dist/bestiaryxyz/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/bestiaryxyz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
